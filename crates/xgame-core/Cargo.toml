[package]
name = "xgame-core"
version = "0.1.0"
edition = "2021"
description = "XGameEngine core types and traits"

[dependencies]
glam = { version = "0.29", features = ["serde"] }
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
ron = "0.8"
# 反射元数据（`#[derive(Reflect)]`）。derive 只生成代码、不依赖本 crate，
# 所以这里没有循环依赖。
xgame-derive = { path = "../xgame-derive" }
