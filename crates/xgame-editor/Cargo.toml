[package]
name = "xgame-editor"
version = "0.1.0"
edition = "2021"
description = "XGameEngine editor (egui-based)"

[[bin]]
name = "xgame-editor"
path = "src/main.rs"

[dependencies]
strum = { version = "0.27", features = ["derive"] }
eframe = { version = "0.30", features = ["wgpu"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
egui_tiles = "0.11"
wgpu = "23"
winit = "0.30"
log = "0.4"
env_logger = "0.11"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
anyhow = "1"
ron = "0.8"
glam = "0.29"
# 原生文件对话框（项目枢纽里「打开项目 / 选择位置」用）。
rfd = "0.17"

xgame-core = { path = "../xgame-core" }
xgame-derive = { path = "../xgame-derive" }
xgame-math = { path = "../xgame-math" }
xgame-render = { path = "../xgame-render" }
xgame-physics = { path = "../xgame-physics" }
xgame-input = { path = "../xgame-input" }
xgame-script = { path = "../xgame-script" }
xgame-runtime = { path = "../xgame-runtime" }
