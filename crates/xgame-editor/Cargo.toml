[package]
name = "xgame-editor"
version = "0.1.0"
edition = "2021"
description = "XGameEngine editor (egui-based)"

[[bin]]
name = "xgame-editor"
path = "src/main.rs"

[dependencies]
strum = { version = "0.27", features = ["derive"] }
eframe = { version = "0.30", features = ["wgpu"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
egui_tiles = "0.11"
wgpu = "23"
winit = "0.30"
log = "0.4"
env_logger = "0.11"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
anyhow = "1"
ron = "0.8"
glam = "0.29"
# 原生文件对话框（项目枢纽里「打开项目 / 选择位置」用）。
rfd = "0.17"
# 解析 `cargo build --message-format=json` 的 compiler-artifact 行（P0.5）：
# 与其自己扫 target/ 目录猜产物路径，不如让 cargo 自己报出文件名。
serde_json = "1"

# 门面 crate（P0.5）：编辑器要经它加载插件动态库 —— `load_plugin` /
# `LoadedPlugin::register_into` 是唯一过境点，不绕开版本握手直接用 libloading。
xgame = { path = "../xgame" }

xgame-core = { path = "../xgame-core" }
xgame-derive = { path = "../xgame-derive" }
xgame-math = { path = "../xgame-math" }
xgame-render = { path = "../xgame-render" }
xgame-physics = { path = "../xgame-physics" }
# `gilrs`：Play 态要能用手柄试玩（与独立游戏同一套后端）。
# 编辑器不是库 crate，把设备后端收进来不影响插件构建。
xgame-input = { path = "../xgame-input", features = ["gilrs"] }
xgame-script = { path = "../xgame-script" }
xgame-runtime = { path = "../xgame-runtime" }
xgame-particle = { path = "../xgame-particle" }
