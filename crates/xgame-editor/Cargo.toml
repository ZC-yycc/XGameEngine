[package]
name = "xgame-editor"
version = "0.1.0"
edition = "2021"
description = "XGameEngine editor (egui-based)"

[[bin]]
name = "xgame-editor"
path = "src/main.rs"

[dependencies]
egui_dock = "0.12"
eframe = "0.30"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }


egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
egui_tiles = "0.11"
wgpu = "23"
winit = "0.30"
log = "0.4"
env_logger = "0.11"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
anyhow = "1"
ron = "0.8"
glam = "0.29"

xgame-core = { path = "../xgame-core" }
xgame-math = { path = "../xgame-math" }
xgame-render = { path = "../xgame-render" }
xgame-physics = { path = "../xgame-physics" }
