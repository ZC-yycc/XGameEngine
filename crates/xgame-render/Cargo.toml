[package]
name = "xgame-render"
version = "0.1.0"
edition = "2021"
description = "XGameEngine wgpu-based renderer"

[dependencies]
wgpu = "23"
winit = "0.30"
log = "0.4"
env_logger = "0.11"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
# `extras` 打开才能读 `mesh.extras.targetNames` —— 形变目标的名字是
# Inspector 滑条标题与脚本按名查找的唯一来源，没有它只能是 "Target 3"。
gltf = { version = "1", features = ["extras"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
image = "0.24"

xgame-core = { path = "../xgame-core" }
xgame-math = { path = "../xgame-math" }
xgame-ui = { path = "../xgame-ui" }
xgame-particle = { path = "../xgame-particle" }

[dev-dependencies]
xgame-physics = { path = "../xgame-physics" }
