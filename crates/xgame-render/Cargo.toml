[package]
name = "xgame-render"
version = "0.1.0"
edition = "2021"
description = "XGameEngine wgpu-based renderer"

[dependencies]
wgpu = "23"
winit = "0.30"
log = "0.4"
env_logger = "0.11"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"
gltf = "1"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
image = "0.24"

xgame-core = { path = "../xgame-core" }
xgame-math = { path = "../xgame-math" }
xgame-ui = { path = "../xgame-ui" }

[dev-dependencies]
xgame-physics = { path = "../xgame-physics" }
