[package]
name = "xgame-script"
version = "0.1.0"
edition = "2021"
description = "XGameEngine scripting: embedded Lua host with a game-facing API"

[dependencies]
xgame-core = { path = "../xgame-core" }
xgame-math = { path = "../xgame-math" }
xgame-input = { path = "../xgame-input" }
xgame-physics = { path = "../xgame-physics" }
# Lua 宿主。`vendored` 把 Lua 5.4 源码捆进来随宿主编译 —— 不依赖系统装没装
# Lua，也不会因为用户机器上的 Lua 版本对不上而行为漂移。
# `serialize` 暂不用（脚本状态表走引擎侧托管，不靠 Lua 序列化），留着无害但
# 不开，少一条编译路径。
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
log = "0.4"
thiserror = "2"
