[package]
name = "xgc-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "XGC 编辑器状态模型：打开 / 保存 / 选择 / Inspector / Play 快照"

[dependencies]
xgc-base = { path = "../xgc-base" }
xgc-reflect = { path = "../xgc-reflect" }
xgc-world = { path = "../xgc-world" }
xgc-store = { path = "../xgc-store" }
xgc-sim = { path = "../xgc-sim" }
xgc-render = { path = "../xgc-render" }
xgc-migrate = { path = "../xgc-migrate" }
eframe = { version = "0.30", default-features = false, features = ["wgpu", "default_fonts"] }
# 离线缓存只有 0.1.29 源码；moxcms 的 ^0.1.1 允许它。
pxfm = "=0.1.29"

[[bin]]
name = "xgc-editor"
path = "src/main.rs"
