[package]
name = "xgc-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "XGC 独立播放器：从 cooked 目录加载世界并驱动脚本"

[dependencies]
xgc-asset = { path = "../xgc-asset" }
xgc-host = { path = "../xgc-host" }
xgc-sim = { path = "../xgc-sim" }
xgc-store = { path = "../xgc-store" }
xgc-world = { path = "../xgc-world" }
xgc-render = { path = "../xgc-render" }
eframe = { version = "0.30", default-features = false, features = ["wgpu", "default_fonts"] }
