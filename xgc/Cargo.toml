[workspace]
resolver = "2"
members = [
    "crates/xgc-base",
    "crates/xgc-reflect",
    "crates/xgc-world",
    "crates/xgc-store",
    "crates/xgc-sim",
    "crates/xgc-agent",
    "crates/xgc-cli",
    "crates/xgc-xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
