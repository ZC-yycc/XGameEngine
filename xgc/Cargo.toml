[workspace]
resolver = "2"
members = [
    "crates/xgc-base",
    "crates/xgc-reflect",
    "crates/xgc-world",
    "crates/xgc-store",
    "crates/xgc-sim",
    "crates/xgc-agent",
    "crates/xgc-asset",
    "crates/xgc-render",
    "crates/xgc-migrate",
    "crates/xgc-script",
    "crates/xgc-editor",
    "crates/xgc-audio",
    "crates/xgc-cli",
    "crates/xgc-xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# 离线工作区：clipboard-win 5.4.1 已被 yank，但本机只有该版本缓存。
[patch.crates-io]
eframe = { path = "vendor/eframe" }
