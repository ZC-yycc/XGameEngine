name: CI

# 只跑 Windows：引擎目前只在 Windows 实测，MSVC 是唯一验证过的构建面。
# GPU 截图测试留给带显卡的自托管 runner；hosted 的 Test 步骤在进入驱动前 skip。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI 的 target 缓存只服务一次构建，关掉增量可显著缩小缓存体积。
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows / stable
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # --locked：Cargo.lock 是提交物，CI 不允许静默升级依赖。
      - name: Check
        run: cargo check --locked --workspace --all-targets

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # plugin_loading 会在 dlopen 前让 Cargo 复核 cdylib 新鲜度；cargo test 本身不产
      # cdylib；hosted 的外层 cargo test 中再起同 target 的 Cargo 实测会等到超时。
      # 同批提前产出两个测试插件，也顺便准备后面的发布包组合验收二进制。
      - name: Build plugins and package acceptance binaries
        run: >-
          cargo build --locked -p xgame-editor -p xgame-game
          -p xgame-project -p spinner-plugin

      - name: Test
        run: cargo test --locked --workspace --all-targets
        env:
          # 上一步成功才会到这里；测试仍检查产物存在，插件还会校验构建指纹。
          XGAME_TEST_PREBUILT_ARTIFACTS: "1"
          # windows-latest 可能在 wgpu 进入驱动后原生崩溃，来不及返回“无适配器”；
          # 只约束单元测试，后续发布包 headless 与真实 CLI 冒烟不继承这个变量。
          XGAME_TEST_SKIP_GPU: "1"

      # 发布包组合门禁：debug 即可验证内容与运行时契约，不做 release / GPU 渲染。
      # 夹具会把包搬离源码目录，再经确定性输入时间线验 input.ron、Rust 插件与三关切换。
      - name: Packaged headless acceptance
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-published-player.ps1
          -Mode headless -BinDir target/debug -Plugin target/debug/xgame_project.dll
          -OutputRoot "$env:RUNNER_TEMP"

      # 下面四步是二进制级冒烟：单元测试之外，确认真实 CLI 入口和示例项目仍可用。
      - name: Project check
        run: cargo run --locked -p xgame-editor -- --check projects/XGame

      - name: Headless smoke
        run: cargo run --locked -p xgame-editor -- --headless --frames 30 projects/XGame

      - name: Export schema
        run: cargo run --locked -p xgame-editor -- --export-schema --out "$env:RUNNER_TEMP\xgame-schema.json"

      - name: Export script API
        run: cargo run --locked -p xgame-editor -- --export-script-api --out "$env:RUNNER_TEMP\xgame-script-api.json"
